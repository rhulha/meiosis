<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeneLab Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
            }
        }
    </script>

</head>

<body>
    <script type="module">
        import { GeneLab } from './gene_lab.js';

        const lab = new GeneLab();

        const yellow = 0xffff00;
        const red = 0xff1493;

        let temp = lab.addBall(-15, 5, 0, red);
        temp = lab.addConnectedBall(temp);
        temp = lab.addStickBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);

        temp = lab.addBall(-5, 8, 0, yellow);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addStickBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);

        temp = lab.addBall(5, 10, 0, yellow);
        temp = lab.addConnectedBall(temp);
        temp = lab.addStickBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);

        temp = lab.addBall(10, -5, 0, red);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addStickBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);
        temp = lab.addConnectedBall(temp);

    </script>
</body>

</html>
