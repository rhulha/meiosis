<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeneLab Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
            }
        }
    </script>

</head>

<body>
    <script type="module">
        import { GeneLab } from './gene_lab.js';

        const lab = new GeneLab();
        let maternal_ball1 = lab.addBall(-1, 0, 0, 0xff0000);
        let paternal_ball1 = lab.addBall(1, 0, 0, 0x0000ff);

        let maternal_ball2 = lab.addConnectedBall(maternal_ball1);

        lab.addStickBall(maternal_ball2);
    </script>
</body>

</html>
