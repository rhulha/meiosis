<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeneLab Demo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        #duplicateBtn {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s;
        }

        #duplicateBtn:hover {
            background-color: #45a049;
        }

        #duplicateBtn:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
    <script type="importmap">
        {
            "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.177.0/examples/jsm/"
            }
        }
    </script>

</head>

<body>
    <button id="duplicateBtn">Duplicate Chromosomes</button>

    <script type="module">
        import { GeneLab } from './gene_lab.js';

        const lab = new GeneLab();

        const yellow = 0xffff00;
        const red = 0xff1493;

        const chromo1 = lab.addChromosome("oo-oooo", red, -15, 5, 0);
        const chromo2 = lab.addChromosome("ooo-ooooooo", yellow, -5, 8, 0);
        const chromo3 = lab.addChromosome("oo-oooo", yellow, 5, 10, 0);
        const chromo4 = lab.addChromosome("ooo-ooooooo", red, 10, -5, 0);

        let chromo1_copy, chromo2_copy, chromo3_copy, chromo4_copy;
        let state = 'initial';
        const btn = document.getElementById('duplicateBtn');

        btn.addEventListener('click', async () => {
            btn.disabled = true;

            if (state === 'initial') {
                btn.textContent = 'Duplicating...';
                chromo1_copy = await lab.duplicateChromosome(chromo1, 2.2, 0, 0);
                chromo2_copy = await lab.duplicateChromosome(chromo2, 2.2, 0, 0);
                chromo3_copy = await lab.duplicateChromosome(chromo3, 2.2, 0, 0);
                chromo4_copy = await lab.duplicateChromosome(chromo4, 2.2, 0, 0);

                state = 'duplicated';
                btn.textContent = 'Form Tetrads';
                btn.disabled = false;
            } else if (state === 'duplicated') {
                btn.textContent = 'Forming Tetrads...';
                await lab.formTetrad4(chromo1, chromo1_copy, chromo3, chromo3_copy, 2.2);
                await lab.formTetrad4(chromo2, chromo2_copy, chromo4, chromo4_copy, 2.2);

                state = 'tetrads_formed';
                btn.textContent = 'Crossover';
                btn.disabled = false;
            } else if (state === 'tetrads_formed') {
                btn.textContent = 'Crossing Over...';
                await Promise.all([
                    lab.crossoverTetrad([chromo1, chromo1_copy], [chromo3, chromo3_copy]),
                    lab.crossoverTetrad([chromo2, chromo2_copy], [chromo4, chromo4_copy])
                ]);

                state = 'crossover_done';
                btn.textContent = 'Done';
                btn.disabled = false;
            }
        });

    </script>
</body>

</html>
